services:
  postgres:
    image: postgres:16-alpine
    container_name: eve_healthcare_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: eve_healthcare
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d eve_healthcare"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: eve_healthcare_api
    restart: always
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      NODE_ENV: development
      DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/eve_healthcare?schema=public"
      JWT_SECRET: "eve_healthcare_super_secret_jwt_key_2026_change_in_production"
      JWT_EXPIRES_IN: "24h"
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "npx prisma db push --accept-data-loss &&
             node prisma/seed.js &&
             node src/server.js"

volumes:
  pgdata:
